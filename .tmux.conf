# ==============================
# tmux 配置
# ==============================

# 1) 基础设置
# 启用鼠标：点击切 pane、拖拽调大小、滚轮滚动
set -g mouse on

# 增大历史行数：避免长输出被截断
set -g history-limit 50000

# 降低 Esc 延迟：提升按键响应
set -sg escape-time 10

# 终端类型：启用 256 色
set -g default-terminal "screen-256color"

# 复制命令：将 tmux 复制内容写入 macOS 系统剪贴板
set -s copy-command "pbcopy"

# 2) 状态栏
# 位置：底部
set -g status-position bottom

# 整体配色
set -g status-style 'bg=#1a1a2e fg=#888888'

# 左侧：会话名
set -g status-left '#[fg=#4ec9b0,bold] [#S] '
set -g status-left-length 20

# 右侧：时间
set -g status-right '#[fg=#666666] %H:%M '

# 当前窗口高亮
set -g window-status-current-style 'fg=#4ec9b0,bold'

# 3) Pane 边框
# 非活动 pane 边框
set -g pane-border-style 'fg=#333333'
# 活动 pane 边框
set -g pane-active-border-style 'fg=#4ec9b0'

# 4) 开发布局（仅当 new-session 带 -e mode=dev 时触发）
# 目标布局：上方 2 个 pane（左窄右宽）+ 下方 1 个 pane
set-hook -g after-new-session 'run-shell "if [ \"$(tmux show-environment -t \"#{session_name}\" mode 2>/dev/null)\" = \"mode=dev\" ]; then pane_count=$(tmux list-panes -t \"#{session_name}:0\" 2>/dev/null | wc -l | tr -d \" \"); if [ \"\$pane_count\" = \"1\" ]; then tmux split-window -v -t \"#{session_name}:0.0\" -p 55; tmux split-window -h -t \"#{session_name}:0.0\" -p 59; tmux select-pane -t \"#{session_name}:0.0\"; tmux send-keys -t \"#{session_name}:0.0\" \"mo status\" C-m; fi; fi"'

# 5) 快捷键绑定
# Prefix + r：重载配置
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Prefix + |：左右分屏
bind | split-window -h
# Prefix + -：上下分屏
bind - split-window -v

# Prefix + m：切换 tmux 鼠标开关，便于临时使用 Ghostty 原生框选
bind m if-shell -F "#{mouse}" "set -g mouse off" "set -g mouse on" \; if-shell -F "#{mouse}" 'display-message "Mouse: on"' 'display-message "Mouse: off"'

# 统一复制确认：copy-mode 下按 Enter 直接复制到系统剪贴板
bind -T copy-mode Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel

# Opt/Option + 方向键：无 prefix 切 pane
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
